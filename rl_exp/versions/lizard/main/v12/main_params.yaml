# lizard_params.yaml — SSOT: control parameters for the 26-joint lizard
# (16 leg joints: HAA/HFE/KFE/FOOT x4, 10 spine joints: rear/tail/neck yaw+pitch).
# Geometry/joints/mass/inertia/limits live in lizard.urdf (Blender-generated).
# Isaac Lab env cfg (config/lizard/) and UE exporter (export_ue.py) both read this file.
# Change params here ONLY. Never hand-edit the exported artifacts.
# v3 = v2 params verbatim + the "v3" section (foot rings / r_fc / tilt / c_k).
# v5 = v4 params + reward anti-collapse deltas: r_fc sign fix, legs-only
# r_co body list, and the "v5" section (commands / track_goal_vel / r_slip /
# belly_contact_force). Base sections are shared shape; recipe deltas live
# ONLY in the v3/v5 sections.
# v10 = v8.1 params + the "v10" section (tilt termination removed).
# v11 = v10 params + the "v11" section (joint particle terrain curriculum).
# v12 = v11 params + the "v12" section (Miki S8 reset/obs robustness: joint
# init offsets, base pose/vel ranges exposed, foot-friction dips, height-ring
# noise) + one v5-section delta: r_slip weight back to -0.003 (v12 user
# decision 2026-09-10; v8.1's -0.03 escalation rolled back unprobed).

robot:
  name: lizard
  # produced by convert_urdf.py: {rl_exp}/assets/lizard/lizard.usda
  usd_path: assets/lizard/lizard.usda
  base_body_name: base_link
  # zero pose = natural stance (posed in Blender, baked into geometry):
  # thigh sprawled, shank vertical, blade flat. Blade bottom ~1.1 m below base.
  base_init_height: 1.1

# ground-truth joint order (URDF tree order after the v8 anatomy rename)
joint_order:
  - chest_yaw
  - chest_pitch
  - neck_yaw
  - neck_pitch
  - rf_haa
  - rf_hfe
  - rf_kfe
  - rf_foot
  - lf_haa
  - lf_hfe
  - lf_kfe
  - lf_foot
  - tail1_yaw
  - tail1_pitch
  - tail2_yaw
  - tail2_pitch
  - tail3_yaw
  - tail3_pitch
  - rr_haa
  - rr_hfe
  - rr_kfe
  - rr_foot
  - rl_haa
  - rl_hfe
  - rl_kfe
  - rl_foot


# regex pattern -> default angle (rad), fed to ArticulationCfg.InitialStateCfg
# NOTE: Isaac Lab 3.0 importer appends a "_joint" suffix to joint names.
# Zero pose IS the natural stance (baked into URDF joint origin rpy):
# thigh sprawled out-down, shank vertical, blade flat. All defaults stay 0.
default_joint_pos:
  ".*_haa_joint": 0.0
  ".*_hfe_joint": 0.0
  ".*_kfe_joint": 0.0
  ".*_foot_joint": 0.0
  "chest_.*": 0.0
  "tail[0-9]_.*": 0.0
  "neck.*_.*": 0.0

# ImplicitActuatorCfg groups (PD runs inside the physics solver at 200 Hz;
# sampled 50 Hz explicit torque PD is unstable for the low-inertia spine joints).
# Starting values for the 72 kg robot — tune via training.
actuators:
  legs:
    joint_patterns:
      - ".*_haa_joint"
      - ".*_hfe_joint"
      - ".*_kfe_joint"
    stiffness: 800.0
    damping: 40.0
    effort_limit: 180.0
    velocity_limit: 10.0
    armature: 0.0
  feet:
    joint_patterns:
      - ".*_foot_joint"
    stiffness: 200.0
    damping: 12.0
    effort_limit: 70.0
    velocity_limit: 6.0
    armature: 0.0
  spine:
    joint_patterns:
      - "chest_.*"
      - "tail[0-9]_.*"
      - "neck.*_yaw_joint"
      - "neck.*_pitch_joint"
    # v6.2 (user decision 2026-09-07): 150/10 left 0.2-0.45 rad gravity sag on
    # the 2 m neck/tail levers; 400/20 keeps the family ratio (c = k/20) and
    # shrinks the sag to ~0.08-0.17 rad. Effort limit stays 80 N.m (measured
    # gravity torque 30-67 N.m) -- transients clip, implicit drive clips mildly.
    stiffness: 400.0
    damping: 20.0
    effort_limit: 80.0
    velocity_limit: 4.0
    armature: 0.0

action:
  legs_scale: 0.5
  spine_scale: 0.25
  use_default_offset: true

sim:
  dt: 0.005
  decimation: 4
  episode_length_s: 20.0

# body name patterns for reward/termination terms
names:
  # foot blades are the only desired contacts
  foot_body_names:
    - ".*_foot"
  # v5: r_co narrowed to thigh/shank (paper r_co penalizes exactly these).
  # The base body moved to the dedicated continuous belly_contact_force
  # penalty (see v5 section); HAA and spine links are exempt by user
  # decision 2026-09-03. Frozen v1-v4 recipes keep their own yaml copies.
  undesired_contact_body_names:
    - ".*_hfe"
    - ".*_kfe"

# policy observation layout (v3: three groups, delivered by name — see
# teacher_networks.py OBS_GROUP_CONTRACT and FAMILY.md v3 row)
# UE side must assemble obs groups with these names/dims, same units (SI, rad, m/s)
obs_layout:
  - name: base_lin_vel
    dim: 3
  - name: base_ang_vel
    dim: 3
  - name: projected_gravity
    dim: 3
  - name: velocity_commands
    dim: 3
  - name: joint_pos_rel
    dim: 26
  - name: joint_vel_rel
    dim: 26
  - name: last_action
    dim: 26

commands:
  lin_vel_x: [-1.0, 3.0]
  lin_vel_y: [-0.5, 0.5]
  ang_vel_z: [-1.0, 1.0]

# v1: DR uniformly NARROWED (never disabled) to lower the first-walk bar
# for the teacher diagnostic run; v0 keeps the original full ranges.
domain_randomization:
  friction_static: [0.7, 1.0]
  friction_dynamic: [0.6, 0.9]
  friction_restitution: [0.0, 0.0]
  friction_num_buckets: 64
  # log-uniform mass scale, geometric mean 1.0 (scale-invariant across robots)
  mass_scale: [0.95, 1.05]
  # per-limb mass randomization (all non-base bodies)
  mass_scale_limbs: [0.9, 1.11]
  limb_body_names:
    - ".*_haa"
    - ".*_hfe"
    - ".*_kfe"
    - ".*_foot"
    - ".*_yaw"
    - ".*_pitch"
  com_range:
    x: [-0.02, 0.02]
    y: [-0.02, 0.02]
    z: [-0.01, 0.01]
  inertia_scale: [0.9, 1.1]
  stiffness_scale: [0.9, 1.1]
  damping_scale: [0.9, 1.1]
  joint_friction_add: [0.0, 0.01]
  joint_armature_add: [0.0, 0.005]
  external_force_range: [-15.0, 15.0]
  external_torque_range: [-2.0, 2.0]
  # spawn height jitter [m] around base_init_height, relative to the default pose
  reset_height_range: [-0.05, 0.05]
  push_velocity_range:
    x: [-0.5, 0.5]
    y: [-0.5, 0.5]
    z: [-0.1, 0.1]

# --- v3 recipe deltas (teacher paper-alignment, versions/lizard/v3/PLAN.md) ---
v3:
  # C1/C2: per-foot ring scanners (4 x RayCaster on {lf,rf,rl,rr}_foot).
  # 52 points = ring_counts x ring_radii (paper S1); cast downward, yaw-aligned,
  # extero obs = height_scan (foot-relative terrain elevation, clip kept).
  # v5.1 RADIUS RESCALE (2026-09-03): paper radii [0.08..0.48] are absolute
  # meters tuned for the ~0.1 m ANYmal sole -- on our 0.46x0.51 m sole three
  # of five rings scan UNDER the foot. Rescaled x5 to restore the paper's
  # sole-relative ratios (0.8x-5x sole width); outer ring sees ~1 body length
  # ahead on the v4 rubble (0.5 m spacing). Point counts unchanged: obs
  # contract 52/foot x 4 = 208 stays. Frozen v1-v4 recipes keep the paper
  # absolute values.
  foot_ring:
    ring_counts: [6, 8, 10, 12, 16]
    ring_radii: [0.4, 0.8, 1.3, 1.8, 2.4]
    ray_offset_z: 20.0
    # height_scan offset param: 0.0 keeps the ring obs foot-relative and centered
    # (the v2 -0.5 default centers the BASE scan, not the foot scan)
    scan_offset: 0.0
    clip: [-1.0, 1.0]
  # D1: tilt termination, repo convention upright -> projected_gravity_b z = -1.
  # gravity_z_limit = -0.6 (~53 deg); estimate -> ablation knob, not paper-pinned.
  tilt_terminate:
    gravity_z_limit: -0.6
  # D2: anti-drag foot clearance reward (deliberate inversion of the paper's
  # r_fc which penalizes swing feet flying TOO HIGH; see PLAN v3.1 D2 note).
  # Penalize hinge: swing foot clearance below `clearance` over its own
  # vertical-ray terrain height.
  # v5 SIGN FIX (2026-09-03): the v3/v4 copies shipped weight +0.003 on a
  # positive hinge -- a REWARD for low-hanging swing feet, the opposite of
  # the documented intent. Negative here; the frozen v3/v4 recipes keep the
  # original values.
  # SCOPE: max_distance/start_offset govern ONLY the reward's raycast. The priv
  # obs term foot_contact_normals keeps its frozen v2 geometry (2.0/0.5) by
  # design -- an obs contract must not move when a reward knob is tuned.
  r_fc:
    clearance: 0.2
    weight: -0.003
    contact_threshold: 1.0
    max_distance: 2.0
    start_offset: 0.5
  # D3: c_k penalty/DR curriculum. c_k = c0 ** (decay ** iteration),
  # iteration = common_step_counter // steps_per_iteration (policy steps;
  # steps_per_iteration MUST equal the runner's num_steps_per_env — asserted
  # by tools/verify/check_obs_layout.py). Restart-from-scratch reheats the
  # warm-up; resume is not reconstructed.
  curriculum_ck:
    c0: 0.2
    decay: 0.98
    steps_per_iteration: 24

# --- v5 recipe deltas (reward anti-collapse, versions/lizard/v5/PLAN.md) ---
# Closes the four holes that let v3/v4 converge to foot-pad creeping:
# no reward pays for swinging, the exp kernel freeloads at standstill,
# belly contact is free, and r_fc shipped sign-inverted.
v5:
  # forward-only ambition range; lin_vel_y / ang_vel_z keep the base override
  # (-0.5, 0.5) / (-1, 1). The staged speed curriculum is REMOVED in v5 (it
  # was pinned at stage 0 by the freeloaded success_rate anyway).
  commands:
    lin_vel_x: [0.0, 3.0]
  # Cheng et al. 2023 Eq. 2 form: r = min(<v_cmd_hat, v_yaw>, |v_cmd|) /
  # max(|v_cmd|, min_speed) -- standing = 0, reversal < 0, tracking = 1.
  track_goal_vel:
    weight: 1.5
    min_speed: 0.1
  # paper S7 r_slip: penalize contact-foot sliding speed, c_k-scaled.
  # v5.2 SIGN FIX: repo convention carries the penalty sign in the WEIGHT
  # (stock style: negative weight x positive function value); v5.0/v5.1
  # shipped +0.003 which REWARDED sliding -- same bug class as the v3 r_fc
  # sign flip. Paper form: r_slip = -c_k * sum(|v_f|^2) over contact feet.
  # v8.1 ESCALATION (pre-registered above, triggered by the v6 run):
  # weight -0.003 -> -0.03. ROLLED BACK in the v12 copy (user decision
  # 2026-09-10): the x10 was never probed against a clean-stance recipe, and
  # v12's reset randomization + noise additions already raise the training
  # difficulty -- one variable at a time. Frozen v8/v10/v11 keep -0.03.
  r_slip:
    weight: -0.003
  # Continuous belly-contact penalty proportional to net contact force.
  # v5.2 SIGN FIX: weight must be NEGATIVE (repo convention: sign in the
  # weight); v5.0/v5.1 shipped +0.5 which REWARDED belly contact.
  # force_scale = nominal body weight 72 kg x 9.81 ~ 706 N (DR mass scale
  # +-5% shifts the normalization by the same amount; acceptable). Flat-belly
  # resting -> ~-0.5 per step; normal stance -> 0. Deliberately
  # NOT c_k-scaled: lying flat must never become free as the curriculum
  # anneals. Weight is an estimate -> ablation knob.
  belly_contact_force:
    weight: -0.5
    force_scale: 706.0
  # v5.3: SIR terrain curriculum (Lee et al. 2020 Algorithm S1 discrete
  # adaptation; plan versions/lizard/v5/PLAN.md). Particle = (terrain type,
  # difficulty row) on the fixed 8-type x 10-row x 20-col grid (v4 types +
  # flat bootstrap column). Numbers are paper Table S3 verbatim except
  # success_ratio (terminal-episode stand-in for the paper's per-state Tr)
  # and steps_per_iteration (runner plumbing, gated by check_obs_layout.py).
  terrain_curriculum:
    # target success-rate band: rows inside keep sampling weight
    band: [0.5, 0.9]
    # policy iterations between SIR resamples (paper N_evaluate)
    eval_every: 10
    # min episodes per particle row to update its weight (paper N_traj)
    n_traj_min: 6
    # random-walk probability to an adjacent difficulty row
    p_transition: 0.8
    # replay-memory redraw probability
    p_replay: 0.05
    # success = survived to timeout AND displacement >= ratio x commanded distance
    success_ratio: 0.5
    # band-edge softening width (keeps a gradient for resampling)
    soft_edge: 0.05
    # must equal the runner num_steps_per_env (gated by check_obs_layout.py)
    steps_per_iteration: 24

# --- v10 recipe deltas (fall handling, versions/lizard/v10/NOTES.md) ---
v10:
  # D1 REMOVAL: the tilt termination is deleted (null -> the V10 env cfg sets
  # terminations.tilt = None; the v3 section above stays as the frozen record
  # for v1-v8). The v3 pg_z limit (instantaneous total tilt > 53 deg, no dwell
  # window) fired on legitimate pitch -- terrain slopes <= 26 deg plus dynamic
  # vaulting/spine articulation -- killing Episode_Termination/tilt 0.60
  # (v8.1 @7700) / 0.76 (v6 @8950) of episodes early and pinning SIR
  # success_rate at 0.019 (success requires surviving to timeout). With no
  # termination, fallen states stay in the rollout data: the
  # belly_contact_force penalty (-0.5/step) plus zero tracking supplies the
  # get-up gradient, and the 2 m tail + sprawled legs give the ground
  # righting apparatus (lizards right themselves in seconds; gecko-style
  # tail righting, Jusufi et al. 2008). Only time_out terminates now.
  # PRE-REGISTERED counter-hack: if the probe shows sustained
  # belly_contact_force > 0 WITH high tracking (upside-down crawling nets
  # 1.5 - 0.5 > 0), raise the belly_contact_force weight.
  tilt_terminate: null

# --- v11 recipe deltas (joint particle terrain curriculum, versions/lizard/v11/PLAN.md) ---
# Multi-dim joint SIR (Lee et al. 2020 Alg. S1 + joint-particle extension):
# particle = (terrain param combo, velocity bucket) on a frozen param-sampled
# grid. terrain_grid: per-type difficulty LEVEL tables -- every combination
# becomes one sub-terrain with single-value ranges (the stock difficulty
# interpolation becomes a no-op), so columns are independent param combos
# instead of points on the difficulty diagonal (the fix for the diagonal
# problem, v11 PLAN section 1). Rows are interchangeable instances (fresh
# noise realizations for stochastic functions). Sub-terrain names encode
# combos as <type>|<lvl>_<lvl>... (0-based levels, yaml axis order); flat has
# no axes. All difficulty levels AND curriculum knobs are tunable HERE (user
# decision 2026-09-10); retuning levels is a parameter-level v11.M change.
v11:
  terrain_grid:
    # grid shape: rows = instances per combo, cols must give every combo
    # >= 1 column (builder asserts; 58 combos at the default proportions)
    num_rows: 4
    num_cols: 120
    stairs:
      proportion: 0.2
      # v11.1: top 0.55 -> 0.45 (linear respace) -- the dynamics check put
      # the ceiling at the body, not the legs: torque/power pass at 180 N.m,
      # but 0.55 = 59% of the 0.94 m stance height the belly must clear, and
      # 0.42/0.55 were never validated by any run (terrain_levels floor-bound,
      # eval suites stop at 0.20). v3.4.1 stall criterion anticipated this.
      step_height: [0.08, 0.17, 0.27, 0.36, 0.45]  # 5 levels [m]
      step_width: [0.5, 0.7, 0.95]                 # 3 levels [m] (v5 pinned 0.7)
    stairs_inv:
      proportion: 0.2
      step_height: [0.08, 0.17, 0.27, 0.36, 0.45]
      step_width: [0.5, 0.7, 0.95]
    stepping_stones:
      proportion: 0.1
      stone_width: [0.5, 0.7, 0.9]
      stone_distance: [0.3, 0.5, 0.7]
    boxes:
      proportion: 0.1
      grid_height: [0.08, 0.19, 0.30]
      grid_width: [0.6, 0.9]
    random_rough:
      proportion: 0.2
      noise_amp: [0.10, 0.18, 0.27, 0.35]
    slope:
      proportion: 0.1
      slope: [0.0, 0.15, 0.30, 0.45]
    slope_inv:
      proportion: 0.1
      slope: [0.0, 0.15, 0.30, 0.45]
    flat:
      proportion: 0.125
  # joint particle's velocity axis: lin_vel_x bucket values [m/s]
  velocity_buckets: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0]
  # curriculum knobs (Lee Table S3 defaults unless noted)
  terrain_curriculum:
    # per-trajectory Tr band, paper Eq. 4/5 (user decision 2026-09-10)
    band: [0.5, 0.9]
    # particles per terrain type (paper: 10; raised for the joint space)
    particles_per_type: 16
    # policy iterations between SIR resamples (paper N_evaluate)
    eval_every: 10
    # min trajectories per (combo, bucket) pair to update its weight (paper N_traj)
    n_traj_min: 6
    # single-axis random-walk probability (one param axis or the velocity axis)
    p_transition: 0.8
    # replay-memory redraw probability
    p_replay: 0.05
    # band-empty fallback: maintenance share on learned pairs (v11 PLAN 4.1)
    maintain_mass: 0.1
    # must equal the runner num_steps_per_env (gated by check_obs_layout.py)
    steps_per_iteration: 24
  # Eq. 2 label threshold + bucket jitter live on the command term (V11 wiring)
  velocity_command:
    # per-step traversability label: nu = 1 iff v_pr > threshold [m/s]
    # (paper: ~1/3 of max speed; kept ABSOLUTE for the (0,3) command domain --
    # low buckets are then naturally easy and get pushed to harder terrain)
    v_pr_threshold: 0.2
    # uniform jitter [m/s] around the particle's bucket value
    command_jitter: 0.1

# --- v12 recipe deltas (Miki et al. 2022 S8 robustness package, ---
# --- versions/lizard/v12/PLAN.md) ---
# Closes the three S8 gaps the 2026-09-10 audit found vs the paper. All
# values are estimates -> ablation knobs (the paper prints no reset offsets
# and its per-leg noise vector z is incomplete).
v12:
  reset_randomization:
    # joint initial state at reset (paper S8). The stock scale-type term is
    # a no-op on this rig (all-zero default pose); these are OFFSETS around
    # the default, soft-limit clamped by the framework. [rad]
    joints:
      legs: [-0.2, 0.2]
      feet: [-0.1, 0.1]
      spine: [-0.1, 0.1]
    # joint initial velocity offset [rad/s]
    joint_velocity: [-0.5, 0.5]
    # base pose ranges [m / m / m / rad] -- values are the stock base-cfg
    # ones the teacher line has ALWAYS inherited (audit 2026-09-10: this
    # randomization already existed; only now tunable)
    base_pose_range:
      x: [-0.5, 0.5]
      y: [-0.5, 0.5]
      z: [-0.05, 0.05]
      yaw: [-3.14, 3.14]
    # base velocity ranges at reset [m/s / rad/s]
    base_velocity_range:
      x: [-0.5, 0.5]
      y: [-0.5, 0.5]
      z: [-0.5, 0.5]
      roll: [-0.5, 0.5]
      pitch: [-0.5, 0.5]
      yaw: [-0.5, 0.5]
    # occasional foot-friction dips (paper S8 "occasionally lowered"):
    # p_dip share of resets redraw the FOOT static friction into the band,
    # dynamic = ratio x static; the priv foot_friction obs follows in the
    # same call. [dimensionless]
    friction_dip:
      p_dip: 0.1
      static: [0.05, 0.3]
      dynamic_ratio: [0.7, 1.0]
  # height-ring noise on the actor extero group (paper S8 noise model;
  # DEVIATION: teacher-side, no student -- user decision 2026-09-10).
  # Conditions drawn per episode at ratios below, redrawn midway; amplitudes
  # scale linearly with c_k (same schedule as the DR wrappers).
  # sigma_w: per-foot per-episode bias [m]; sigma_f: per-foot per-step [m];
  # sigma_p: per-point per-step [m]; outliers replace samples [m].
  height_noise:
    ratios: [0.6, 0.3, 0.1]
    sigma_w: 0.15
    sigma_f: 0.05
    sigma_p: 0.02
    outlier_prob: 0.02
    outlier_range: [-1.0, 1.0]
