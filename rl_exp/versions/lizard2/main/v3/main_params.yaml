# V3: approved candidate body; v2 recipe unchanged except asset/action interface.
robot:
  name: lizard2
  usd_path: lizard2_candidate/lizard2_candidate.usda
  base_body_name: base_link
  base_init_height: 1.1
joint_order:
  - chest_yaw
  - chest_pitch
  - neck_yaw
  - neck_pitch
  - rf_hip
  - rf_haa
  - rf_hfe
  - rf_kfe
  - rf_foot
  - lf_hip
  - lf_haa
  - lf_hfe
  - lf_kfe
  - lf_foot
  - tail1_yaw
  - tail1_pitch
  - tail2_yaw
  - tail2_pitch
  - tail3_yaw
  - tail3_pitch
  - rr_hip
  - rr_haa
  - rr_hfe
  - rr_kfe
  - rr_foot
  - rl_hip
  - rl_haa
  - rl_hfe
  - rl_kfe
  - rl_foot
# All 30 joints retain zero default targets [rad]; excluded actions still have PD.
default_joint_pos:
  ".*_hip_joint": 0.0
  ".*_haa_joint": 0.0
  ".*_hfe_joint": 0.0
  ".*_kfe_joint": 0.0
  ".*_foot_joint": 0.0
  "chest_.*": 0.0
  "tail[0-9]_.*": 0.0
  "neck.*_.*": 0.0
actuators:
  legs:
    joint_patterns:
      - ".*_hip_joint"
      - ".*_haa_joint"
      - ".*_hfe_joint"
      - ".*_kfe_joint"
    stiffness: 800.0
    damping: 40.0
    effort_limit: 180.0
    velocity_limit: 10.0
    armature: 0.0
  feet:
    joint_patterns:
      - ".*_foot_joint"
    stiffness: 200.0
    damping: 12.0
    effort_limit: 70.0
    velocity_limit: 6.0
    armature: 0.0
  spine:
    joint_patterns:
      - "chest_.*"
      - "tail[0-9]_.*"
      - "neck.*_yaw_joint"
      - "neck.*_pitch_joint"
    stiffness: 400.0
    damping: 20.0
    effort_limit: 80.0
    velocity_limit: 4.0
    armature: 0.0
# 12 leg + 10 spine actions. kfe/foot are not mechanically locked.
action:
  legs_scale: 0.5
  spine_scale: 0.25
  use_default_offset: true
  joints:
    legs:
      - ".*_hip_joint"
      - ".*_haa_joint"
      - ".*_hfe_joint"
    spine:
      - "chest_.*"
      - "neck_.*"
      - "tail[0-9]_.*"
sim:
  dt: 0.005
  decimation: 4
  episode_length_s: 20.0
names:
  foot_body_names:
    - ".*_foot"
  undesired_contact_body_names:
    - ".*_hfe"
    - ".*_kfe"
  head_contact_body_names:
    - "chest_pitch"
    - "neck_pitch"
commands:
  lin_vel_x: [0.0, 3.0]
  lin_vel_y: [0.0, 0.0]
  ang_vel_z: [0.0, 0.0]
  heading_command: false
  rel_standing_envs: 0.0
rewards:
  track_lin_vel_xy_miki: 1.5
  track_ang_vel_z_exp: 0.5
  lin_vel_z_l2: -2.0
  action_rate_l2: -0.01
  dof_torques_l2: -1.0e-5
  undesired_contacts: -1.0
  belly_contact_force: -0.5
terminations:
  terms:
    - base_contact
    - head_contact
  base_contact_threshold: 1.0
  head_contact_threshold: 1.0
params:
  belly_force_scale: 706.0
  miki_sigma_sq: 0.25
  track_std: 0.5
